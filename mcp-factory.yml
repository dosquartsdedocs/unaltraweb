schema_version: 1
name: unaltraweb
kind: codex-mcp-factory
version: 0.3.0
description: Reusable Jekyll website factory with package-owned site creation and MCP tooling for content, profiles, captures, visualizations, bibliography, bibliometrics, and build checks.
repository: https://github.com/dosquartsdedocs/unaltraweb
install_scope: user
workspace_rule:
  consumer_root: .
  init_creates:
    - .gitignore
    - .github/workflows/deploy.yml
    - _config.yml
    - Makefile
    - Gemfile
    - Gemfile.lock
    - _pages
    - _posts
    - _news
    - _projects
    - _outputs
    - _chapters
    - _documentation
    - _bibliography
    - _data
    - assets
    - context
    - .unaltraweb/computations.yml
    - .github/workflows
    - .unaltraweb/scaffold.json
  source_paths:
    - _config.yml
    - .unaltraweb/computations.yml
    - .vegavisuals.yml
    - _pages
    - _posts
    - _news
    - _projects
    - _outputs
    - _chapters
    - _documentation
    - _books
    - _theses
    - _data
    - assets
    - context
  generated_paths:
    - _site
    - tmp
    - .cache/scimago
    - .unaltraweb/computations.lock.json
    - .unaltraweb/receipts/diavisuals.json
    - .unaltraweb/receipts/vegavisuals.json
    - assets/diagrams/**/*.svg from Mermaid or PlantUML sources
    - assets/**/*.capture.png and assets/**/*.capture.svg from selector-based web capture recipes
    - .vegavisuals.lock.json and outputs declared by .vegavisuals.yml
  allowed_external_writes: []
runtime:
  kind: container
  package_manager: docker
  image: ghcr.io/dosquartsdedocs/unaltraweb-mcp:0.3.0
  package: unaltraweb-mcp
  module: unaltraweb_mcp
transport:
  type: stdio
  command:
    - make
    - -C
    - '${factoryRoot}'
    - mcp-stdio
    - 'PROJECT=${workspaceFolder}'
commands:
  build:
    - make
    - mcp-build
  check:
    - make
    - mcp-check
  smoke:
    - make
    - mcp-smoke
discovery:
  suggested_scan_roots:
    - ~/git
  notes:
    - Consumer website repositories remain the workspace root.
    - The on-demand stdio launcher mounts the current workspace into the Dockerized MCP runtime.
    - Site builds execute inside the MCP runtime; previews use one labelled container per consumer project.
    - Durable website state belongs in versioned site files, not in chat history.
release:
  default: v0.3.0
contracts:
  component_bom: 1
  distribution_doctor: 1
mcp:
  server_name: unaltraweb
  transport: stdio
  resources:
    - web://distribution
    - web://site-context
    - web://site-doctor
    - web://new-web-scaffolds
    - web://starter-templates
    - web://profile-contract
    - web://manual-writing-guidance
    - web://manual-authoring-components
    - web://manual-computations
    - web://web-captures
    - web://profile-prune-plan
    - web://content-inventory
    - web://language-policy
    - web://content-approval
    - web://translation-plan
    - web://bibliography
    - web://bibliometrics
    - web://build-health
    - web://prompts
  required_tools:
    - distribution_doctor
    - new_web
    - initialize_site
    - starter_templates
    - site_context
    - site_doctor
    - detect_site
    - site_check
    - site_source_read
    - site_source_write
    - site_source_delete
    - scaffold_sync
    - profile_check
    - manual_source_quality_check
    - manual_editorial_quality_check
    - manual_authoring_capabilities
    - manual_computation_status
    - manual_computation_check
    - manual_computation_render
    - manual_computation_render_figures
    - web_capture_status
    - web_capture_check
    - web_capture_render
    - manual_pdf_status
    - manual_pdf_build
    - manual_pdf_publish
    - profile_prune_plan
    - profile_prune
    - content_inventory
    - language_policy
    - content_approval_inventory
    - translation_plan
    - content_freshness_check
    - bibliography_inventory
    - bibliography_add_entry
    - bibliometrics_check
    - bibliometrics_fetch_scimago
    - bibliometrics_update
    - build_site
    - build_health
    - html_audit
    - preview_start
    - preview_status
    - preview_stop
    - http_check
mcp_dependencies:
  - name: diavisuals
    role: shared-diagram-renderer
    required: true
    install: true
    build: true
    init: false
    check: true
    smoke: true
    update: false
    remote: https://github.com/dosquartsdedocs/diavisuals.git
    package: diavisuals
    uv_spec: "diavisuals[mcp] @ git+https://github.com/dosquartsdedocs/diavisuals.git@v0.3.1"
    version: 0.3.1
    release: v0.3.1
    release_status: released
    extras:
      - mcp
    required_tools:
      - compatibility_status
      - release_status
      - factory_manifest
      - project_check
      - render_diagram
      - render_diagram_text
    required_resources:
      - diavisuals://project/check
      - diavisuals://factory-manifest
    suggested_path: ../diavisuals
    reason: Mermaid and PlantUML rendering/styles are owned by diavisuals.
  - name: vegavisuals
    role: shared-vega-renderer
    required: true
    install: true
    build: true
    init: false
    check: true
    smoke: true
    update: false
    remote: https://github.com/dosquartsdedocs/vegavisuals.git
    package: vegavisuals
    uv_spec: "vegavisuals[mcp] @ git+https://github.com/dosquartsdedocs/vegavisuals.git@v0.3.1"
    version: 0.3.1
    release: v0.3.1
    release_status: released
    extras:
      - mcp
    required_tools:
      - initialize_project
      - validate_visualization
      - render_visualization
      - visualization_status
      - visualization_check
      - render_visualizations
      - compatibility_status
      - release_status
      - factory_manifest
    required_resources:
      - vegavisuals://project/check
      - vegavisuals://factory-manifest
    suggested_path: ../vegavisuals
    reason: Vega-Lite and Vega validation, rendering, themes, and freshness are owned by vegavisuals.
