# Kept as a lightweight compatibility compose file; it now uses the unaltraweb image.
services:
  jekyll:
    image: ghcr.io/dosquartsdedocs/unaltraweb:main
    #build: .
    ports:
      - 4000:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
