name: Reusable site deploy

on:
  workflow_call:
    inputs:
      ruby-version:
        description: Ruby version used to build the Jekyll site.
        required: false
        type: string
        default: "3.3.5"
      python-version:
        description: Python version used by optional unaltraweb tooling.
        required: false
        type: string
        default: "3.13"
      install-python-requirements:
        description: Install requirements.txt from the site repository when present.
        required: false
        type: boolean
        default: false
      check-computations:
        description: Reject stale generated Markdown and figures before building.
        required: false
        type: boolean
        default: true
      check-web-captures:
        description: Reject stale selector-based screenshot artefacts before building.
        required: false
        type: boolean
        default: true
      check-visualizations:
        description: Reject stale manifest-backed Vega visualization artefacts before building.
        required: false
        type: boolean
        default: true
      check-manual-pdf:
        description: Rebuild manual PDFs and reject public copies that do not match.
        required: false
        type: boolean
        default: false
      sync-manual-pdf:
        description: Build and copy enabled manual PDFs before rendering the website.
        required: false
        type: boolean
        default: true
      vegavisuals-sha:
        description: Full reviewed vegavisuals commit SHA; required when the site has .vegavisuals.yml.
        required: false
        type: string
        default: ""
      build-command:
        description: Optional custom command that builds the site into the output folder.
        required: false
        type: string
        default: ""
      output-folder:
        description: Folder to publish.
        required: false
        type: string
        default: "_site"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true

      - name: Setup Python
        if: ${{ inputs.install-python-requirements || inputs.check-computations || inputs.check-web-captures || inputs.check-visualizations || inputs.check-manual-pdf || inputs.sync-manual-pdf }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install Python dependencies
        if: ${{ inputs.install-python-requirements }}
        run: |
          if test -f requirements.txt; then
            python -m pip install -r requirements.txt
          fi

      - name: Install Vega visualization tooling
        if: ${{ inputs.check-visualizations || inputs.check-manual-pdf || inputs.sync-manual-pdf }}
        env:
          VEGAVISUALS_SHA: ${{ inputs.vegavisuals-sha }}
        run: |
          if test ! -f .vegavisuals.yml; then
            echo "No .vegavisuals.yml; skipping vegavisuals installation."
            exit 0
          fi
          if [[ ! "$VEGAVISUALS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "vegavisuals-sha must be a full lowercase 40-character commit SHA." >&2
            exit 1
          fi
          python -m pip install "vegavisuals @ git+https://github.com/dosquartsdedocs/vegavisuals.git@${VEGAVISUALS_SHA}"

      - name: Check computation freshness
        if: ${{ inputs.check-computations }}
        run: |
          python -c 'import yaml' 2>/dev/null || python -m pip install PyYAML==6.0.2
          core_dir="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print spec.full_gem_path')"
          make -C "$core_dir" manual-compute-check PROJECT="$GITHUB_WORKSPACE"

      - name: Check web capture freshness
        if: ${{ inputs.check-web-captures }}
        run: |
          python -c 'import yaml' 2>/dev/null || python -m pip install PyYAML==6.0.2
          core_dir="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print spec.full_gem_path')"
          make -C "$core_dir" web-capture-check PROJECT="$GITHUB_WORKSPACE"

      - name: Check Vega visualization freshness
        if: ${{ inputs.check-visualizations }}
        run: |
          core_dir="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print spec.full_gem_path')"
          vegavisuals_cli="$(command -v vegavisuals || true)"
          make -C "$core_dir" visualization-check PROJECT="$GITHUB_WORKSPACE" VEGAVISUALS_CLI="$vegavisuals_cli"

      - name: Check published manual PDFs
        if: ${{ inputs.check-manual-pdf }}
        run: |
          core_dir="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print spec.full_gem_path')"
          vegavisuals_cli="$(command -v vegavisuals || true)"
          make -C "$core_dir" manual-pdf-build PROJECT="$GITHUB_WORKSPACE" VEGAVISUALS_CLI="$vegavisuals_cli" MANUAL_PDF_LANG=
          make -C "$core_dir" manual-pdf-check PROJECT="$GITHUB_WORKSPACE" VEGAVISUALS_CLI="$vegavisuals_cli" MANUAL_PDF_LANG=

      - name: Sync manual PDFs
        if: ${{ inputs.sync-manual-pdf }}
        run: |
          python -c 'import yaml' 2>/dev/null || python -m pip install PyYAML==6.0.2
          if python -c 'import sys,yaml; data=yaml.safe_load(open("_config.yml", encoding="utf-8")) or {}; sys.exit(0 if data.get("unaltraweb", {}).get("manual", {}).get("pdf", {}).get("enabled") is True else 1)'; then
            core_dir="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print spec.full_gem_path')"
            vegavisuals_cli="$(command -v vegavisuals || true)"
            make -C "$core_dir" manual-pdf-sync PROJECT="$GITHUB_WORKSPACE" VEGAVISUALS_CLI="$vegavisuals_cli" MANUAL_PDF_LANG=
          else
            echo "Manual PDF generation is disabled; skipping synchronization."
          fi

      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          if test -n "$BUILD_COMMAND"; then
            eval "$BUILD_COMMAND"
          else
            core_config="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print File.join(spec.full_gem_path, "_config.yml")')"
            bundle exec jekyll build --config "$core_config,_config.yml"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ inputs.output-folder }}

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
