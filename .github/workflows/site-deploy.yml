name: Reusable site deploy

on:
  workflow_call:
    inputs:
      ruby-version:
        description: Ruby version used to build the Jekyll site.
        required: false
        type: string
        default: "3.3.11"
      python-version:
        description: Python version used by publication checks and optional unaltraweb tooling.
        required: false
        type: string
        default: "3.13"
      install-python-requirements:
        description: Install requirements.txt from the site repository when present.
        required: false
        type: boolean
        default: false
      check-computations:
        description: Reject stale generated Markdown and figures before building.
        required: false
        type: boolean
        default: true
      check-web-captures:
        description: Reject stale selector-based screenshot artefacts before building.
        required: false
        type: boolean
        default: true
      check-visualizations:
        description: Reject stale manifest-backed Vega visualization artefacts before building.
        required: false
        type: boolean
        default: true
      check-manual-pdf:
        description: Rebuild manual PDFs and reject public copies that do not match.
        required: false
        type: boolean
        default: false
      sync-manual-pdf:
        description: Build and copy enabled manual PDFs before rendering the website.
        required: false
        type: boolean
        default: true
      manual-pdf-image:
        description: Digest-pinned unaltraweb manual PDF worker image.
        required: true
        type: string
      vegavisuals-sha:
        description: Full reviewed vegavisuals commit SHA; required when the site has .vegavisuals.yml.
        required: false
        type: string
        default: ""
      build-command:
        description: Optional custom command that builds the site into the output folder.
        required: false
        type: string
        default: ""
      output-folder:
        description: Folder to publish.
        required: false
        type: string
        default: "_site"
      reviewed_sha:
        description: Full caller commit SHA that passed local review.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    env:
      JEKYLL_ENV: production
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MANUAL_PDF_IMAGE: ${{ inputs.manual-pdf-image }}
      TZ: UTC
      UNALTRAWEB_MANUAL_RELEASE_SELECTOR: latest
    steps:
      - name: Validate latest publication source
        env:
          CURRENT_REF: ${{ github.ref }}
          CURRENT_SHA: ${{ github.sha }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          if [[ "$CURRENT_REF" != "refs/heads/main" ]]; then
            echo "Latest publication is restricted to refs/heads/main." >&2
            exit 1
          fi
          if [[ ! "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$REVIEWED_SHA" != "$CURRENT_SHA" ]]; then
            echo "The reviewed SHA must exactly match the checked out main commit." >&2
            exit 1
          fi
          if [[ ! "$MANUAL_PDF_IMAGE" =~ ^ghcr\.io/dosquartsdedocs/unaltraweb-manual-pdf@sha256:[0-9a-f]{64}$ ]]; then
            echo "manual-pdf-image must be the reviewed GHCR image pinned by digest." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify manual PDF image provenance
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REPOSITORY" != "dosquartsdedocs/unaltraweb" ]] || [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The manual PDF worker must be bound to the immutable canonical provider workflow." >&2
            exit 1
          fi
          # Read data from the defining provider revision, never the consumer checkout.
          workflow_contract_file="$(mktemp "${RUNNER_TEMP:?}/unaltraweb-deploy-contract.XXXXXX")"
          trap 'rm -f -- "$workflow_contract_file"' EXIT
          curl --fail --silent --show-error --proto '=https' --max-filesize 262144 \
            --connect-timeout 10 --max-time 60 \
            "https://raw.githubusercontent.com/dosquartsdedocs/unaltraweb/$WORKFLOW_SHA/src/unaltraweb_mcp/component-contract.json" > "$workflow_contract_file"
          expected_pdf_revision="$(python3 -I - "$MANUAL_PDF_IMAGE" "$workflow_contract_file" <<'PY'
          import json, re, sys
          from pathlib import Path

          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("Duplicate provider contract key")
                  result[key] = value
              return result

          def invalid_constant(value):
              raise ValueError("Non-finite provider contract value")

          raw = Path(sys.argv[2]).read_bytes()
          if len(raw) > 262144:
              raise ValueError("Provider contract exceeds the byte limit")
          contract = json.loads(raw, object_pairs_hook=unique, parse_constant=invalid_constant)
          if type(contract.get("schema_version")) is not int or contract["schema_version"] != 1:
              raise ValueError("Unsupported provider component contract")
          deployment = contract["deployment_contract"]
          if type(deployment["schema_version"]) is not int or deployment["schema_version"] != 1:
              raise ValueError("Unsupported provider deployment contract")
          records = deployment["manual_pdf_workers"]
          if not isinstance(records, list) or not 1 <= len(records) <= 64:
              raise ValueError("Invalid provider worker inventory")
          selected = {}
          for record in records:
              if not isinstance(record, dict) or set(record) != {"reference", "producer_sha"}:
                  raise ValueError("Invalid provider worker record")
              reference, producer = record["reference"], record["producer_sha"]
              if not isinstance(reference, str) or not re.fullmatch(r"ghcr\.io/dosquartsdedocs/unaltraweb-manual-pdf@sha256:[0-9a-f]{64}", reference) or reference.endswith("0" * 64):
                  raise ValueError("Invalid provider worker digest")
              if not isinstance(producer, str) or not re.fullmatch(r"[0-9a-f]{40}", producer) or producer == "0" * 40:
                  raise ValueError("Invalid provider worker source")
              if reference in selected:
                  raise ValueError("Duplicate provider worker digest")
              selected[reference] = producer
          if sys.argv[1] not in selected:
              raise ValueError("The manual PDF digest has no reviewed producer record")
          print(selected[sys.argv[1]])
          PY
          )"
          docker pull "$MANUAL_PDF_IMAGE" >/dev/null
          image_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$MANUAL_PDF_IMAGE")"
          if [[ "$image_revision" != "$expected_pdf_revision" ]]; then
            echo "The manual PDF worker revision label does not match its recorded producer SHA." >&2
            exit 1
          fi

      - name: Configure reproducible site build
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          source_date_epoch="$(git show --no-patch --format=%ct "$REVIEWED_SHA")"
          [[ "$source_date_epoch" =~ ^[0-9]+$ ]]
          printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch" >> "$GITHUB_ENV"

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y imagemagick libcairo2

      - name: Install Python dependencies
        if: ${{ inputs.install-python-requirements }}
        run: |
          if test -f requirements.txt; then
            python -m pip install -r requirements.txt
          fi

      - name: Reject versioned manual publication outputs
        run: |
          python -c 'import yaml' 2>/dev/null || python -m pip install PyYAML==6.0.2
          if test -d .unaltraweb/artifacts; then
            python -m pip install 'pypdf>=6,<7' 'markdown-it-py>=3,<5'
          fi
          core_dir="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print spec.full_gem_path')"
          python "$core_dir/scripts/manual/build_pdf.py" public-paths --project "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/manual-public-paths.json"
          python - "$RUNNER_TEMP/manual-public-paths.json" <<'PY'
          import json
          import subprocess
          import sys

          paths = json.load(open(sys.argv[1], encoding="utf-8"))["paths"]
          tracked = [
              path for path in paths
              if subprocess.run(
                  ["git", "ls-files", "--error-unmatch", "--", path],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              ).returncode == 0
          ]
          if tracked:
              raise SystemExit("Generated manual publication outputs are tracked by Git: " + ", ".join(tracked))
          PY

      - name: Install Vega visualization tooling
        if: ${{ inputs.check-visualizations || inputs.check-manual-pdf || inputs.sync-manual-pdf }}
        env:
          VEGAVISUALS_SHA: ${{ inputs.vegavisuals-sha }}
        run: |
          if test ! -f .vegavisuals.yml; then
            echo "No .vegavisuals.yml; skipping vegavisuals installation."
            exit 0
          fi
          if [[ ! "$VEGAVISUALS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "vegavisuals-sha must be a full lowercase 40-character commit SHA." >&2
            exit 1
          fi
          python -m pip install "vegavisuals @ git+https://github.com/dosquartsdedocs/vegavisuals.git@${VEGAVISUALS_SHA}"

      - name: Check computation freshness
        if: ${{ inputs.check-computations }}
        run: |
          python -c 'import yaml' 2>/dev/null || python -m pip install PyYAML==6.0.2
          core_dir="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print spec.full_gem_path')"
          MCP_CONSUMER_WORKSPACE="$GITHUB_WORKSPACE" make -C "$core_dir" manual-compute-check

      - name: Check web capture freshness
        if: ${{ inputs.check-web-captures }}
        run: |
          python -c 'import yaml' 2>/dev/null || python -m pip install PyYAML==6.0.2
          core_dir="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print spec.full_gem_path')"
          MCP_CONSUMER_WORKSPACE="$GITHUB_WORKSPACE" make -C "$core_dir" web-capture-check

      - name: Check Vega visualization freshness
        if: ${{ inputs.check-visualizations }}
        run: |
          core_dir="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print spec.full_gem_path')"
          vegavisuals_cli="$(command -v vegavisuals || true)"
          MCP_CONSUMER_WORKSPACE="$GITHUB_WORKSPACE" make -C "$core_dir" visualization-check VEGAVISUALS_CLI="$vegavisuals_cli"

      - name: Check published manual PDFs
        if: ${{ inputs.check-manual-pdf }}
        run: |
          core_dir="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print spec.full_gem_path')"
          vegavisuals_cli="$(command -v vegavisuals || true)"
          MCP_CONSUMER_WORKSPACE="$GITHUB_WORKSPACE" make -C "$core_dir" manual-pdf-sync MANUAL_PDF_IMAGE="$MANUAL_PDF_IMAGE" VEGAVISUALS_CLI="$vegavisuals_cli" MANUAL_PDF_LANG=
          MCP_CONSUMER_WORKSPACE="$GITHUB_WORKSPACE" make -C "$core_dir" manual-pdf-check MANUAL_PDF_IMAGE="$MANUAL_PDF_IMAGE" VEGAVISUALS_CLI="$vegavisuals_cli" MANUAL_PDF_LANG=

      - name: Sync manual PDFs
        if: ${{ inputs.sync-manual-pdf && !inputs.check-manual-pdf }}
        run: |
          python -c 'import yaml' 2>/dev/null || python -m pip install PyYAML==6.0.2
          if python -c 'import sys,yaml; data=yaml.safe_load(open("_config.yml", encoding="utf-8")) or {}; sys.exit(0 if data.get("unaltraweb", {}).get("manual", {}).get("pdf", {}).get("enabled") is True else 1)'; then
            core_dir="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print spec.full_gem_path')"
            vegavisuals_cli="$(command -v vegavisuals || true)"
            MCP_CONSUMER_WORKSPACE="$GITHUB_WORKSPACE" make -C "$core_dir" manual-pdf-sync MANUAL_PDF_IMAGE="$MANUAL_PDF_IMAGE" VEGAVISUALS_CLI="$vegavisuals_cli" MANUAL_PDF_LANG=
          else
            echo "Manual PDF generation is disabled; skipping synchronization."
          fi

      - name: Check editorial publication readiness
        run: |
          python -c 'import yaml' 2>/dev/null || python -m pip install PyYAML==6.0.2
          core_dir="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print spec.full_gem_path')"
          python "$core_dir/scripts/editorial_check.py" --project "$GITHUB_WORKSPACE"

      - name: Inspect image backgrounds
        run: |
          python -m pip install 'Pillow>=10.4,<13' 'CairoSVG>=2.7,<3'
          core_dir="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print spec.full_gem_path')"
          python "$core_dir/scripts/image_background_check.py" --project "$GITHUB_WORKSPACE"

      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          if test -n "$BUILD_COMMAND"; then
            eval "$BUILD_COMMAND"
          else
            core_config="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print File.join(spec.full_gem_path, "_config.yml")')"
            bundle exec jekyll build --config "$core_config,_config.yml"
          fi

      - name: Check rendered publication copy
        env:
          OUTPUT_FOLDER: ${{ inputs.output-folder }}
        run: |
          core_dir="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print spec.full_gem_path')"
          python "$core_dir/scripts/editorial_check.py" --project "$GITHUB_WORKSPACE" --output-folder "$OUTPUT_FOLDER"
          python "$core_dir/scripts/image_background_check.py" --project "$GITHUB_WORKSPACE" --output-folder "$OUTPUT_FOLDER"

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ inputs.output-folder }}

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
