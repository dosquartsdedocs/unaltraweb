name: Reusable site deploy

on:
  workflow_call:
    inputs:
      ruby-version:
        description: Ruby version used to build the Jekyll site.
        required: false
        type: string
        default: "3.3.5"
      python-version:
        description: Python version used by optional unaltraweb tooling.
        required: false
        type: string
        default: "3.13"
      install-python-requirements:
        description: Install requirements.txt from the site repository when present.
        required: false
        type: boolean
        default: false
      check-computations:
        description: Reject stale generated Markdown and figures before building.
        required: false
        type: boolean
        default: true
      build-command:
        description: Optional custom command that builds the site into the output folder.
        required: false
        type: string
        default: ""
      output-folder:
        description: Folder to publish.
        required: false
        type: string
        default: "_site"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true

      - name: Setup Python
        if: ${{ inputs.install-python-requirements || inputs.check-computations }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install Python dependencies
        if: ${{ inputs.install-python-requirements }}
        run: |
          if test -f requirements.txt; then
            python -m pip install -r requirements.txt
          fi

      - name: Check computation freshness
        if: ${{ inputs.check-computations }}
        run: |
          python -c 'import yaml' 2>/dev/null || python -m pip install PyYAML==6.0.2
          core_dir="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print spec.full_gem_path')"
          make -C "$core_dir" manual-compute-check PROJECT="$GITHUB_WORKSPACE"

      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          if test -n "$BUILD_COMMAND"; then
            eval "$BUILD_COMMAND"
          else
            core_config="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print File.join(spec.full_gem_path, "_config.yml")')"
            bundle exec jekyll build --config "$core_config,_config.yml"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ inputs.output-folder }}

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
