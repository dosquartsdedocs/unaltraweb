name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "_includes/**"
      - "_layouts/**"
      - "_plugins/**"
      - "_sass/**"
      - "assets/**"
      - "docs/**"
      - "lib/**"
      - "unaltraweb.gemspec"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "_includes/**"
      - "_layouts/**"
      - "_plugins/**"
      - "_sass/**"
      - "assets/**"
      - "docs/**"
      - "lib/**"
      - "unaltraweb.gemspec"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        env:
          BUNDLE_GEMFILE: docs/Gemfile
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Build docs
        env:
          BUNDLE_GEMFILE: docs/Gemfile
          JEKYLL_ENV: production
        run: |
          core_config="$(bundle exec ruby -e 'spec = Gem::Specification.find_by_name("unaltraweb"); print File.join(spec.full_gem_path, "_config.yml")')"
          bundle exec jekyll build --source docs --destination ./_site --config "$core_config,docs/_config.yml"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
