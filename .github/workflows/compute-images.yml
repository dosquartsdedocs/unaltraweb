name: Compute images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-compute-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test package
        run: python -m pip install -e .

      - name: Validate distribution contract
        run: make distribution-check

      - name: Validate publish ref and versions
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/validate_distribution.py --validate-publish-ref --components compute_python,compute_r

      - name: Compile and test computation controller
        run: |
          python -m compileall -q scripts/computations
          PYTHONPATH=src python -m unittest discover -s test/computations -p 'test_*.py'
          PYTHONPATH=src python -m unittest discover -s test -p 'test_mcp_manual_computations.py'

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: python
            component: compute_python
            image: unaltraweb-compute-python
            dockerfile: scripts/computations/python/Dockerfile
          - engine: r
            component: compute_r
            image: unaltraweb-compute-r
            dockerfile: scripts/computations/r/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=compute-${{ matrix.engine }}
          cache-to: type=gha,mode=max,scope=compute-${{ matrix.engine }}

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: python
            component: compute_python
            image: unaltraweb-compute-python
            dockerfile: scripts/computations/python/Dockerfile
          - engine: r
            component: compute_r
            image: unaltraweb-compute-r
            dockerfile: scripts/computations/r/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Docker metadata
        id: meta
        if: github.ref_type == 'branch'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/dosquartsdedocs/${{ matrix.image }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=sha-${{ github.sha }},enable={{is_default_branch}}

      - name: Read release metadata
        id: release
        if: github.ref_type == 'tag'
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          contract = json.load(open("src/unaltraweb_mcp/component-contract.json"))
          component = contract["components"][os.environ["COMPONENT"]]
          if component["release_status"] == "released":
              source = component["reference"]
              candidate = ""
          else:
              receipt = json.load(open("release-candidates.json"))
              source = receipt["components"][os.environ["COMPONENT"]]["reference"]
              candidate = f"{component['image_repository']}:sha-{receipt['source_commit']}"
          print(f"version={contract['release']['version']}")
          print(f"source={source}")
          print(f"repository={component['image_repository']}")
          print(f"candidate={candidate}")
          PY

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify recorded candidate digest
        if: github.ref_type == 'tag'
        env:
          CANDIDATE: ${{ steps.release.outputs.candidate }}
          SOURCE: ${{ steps.release.outputs.source }}
        run: |
          if [ -n "$CANDIDATE" ]; then
            actual="$(docker buildx imagetools inspect "$CANDIDATE" --format '{{.Manifest.Digest}}')"
            expected="${SOURCE##*@}"
            if [ "$actual" != "$expected" ]; then
              printf 'candidate digest mismatch: %s resolves to %s, expected %s\n' "$CANDIDATE" "$actual" "$expected" >&2
              exit 1
            fi
          fi

      - name: Build and publish
        if: github.ref_type == 'branch'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=compute-${{ matrix.engine }}
          cache-to: type=gha,mode=max,scope=compute-${{ matrix.engine }}
          sbom: true
          provenance: mode=max

      - name: Promote selected immutable image
        if: github.ref_type == 'tag'
        env:
          REPOSITORY: ${{ steps.release.outputs.repository }}
          SOURCE: ${{ steps.release.outputs.source }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${REPOSITORY}:${VERSION}" \
            --tag "${REPOSITORY}:v${VERSION}" \
            "$SOURCE"
