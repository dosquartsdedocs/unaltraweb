name: Reusable project compute image

on:
  workflow_call:
    inputs:
      engine:
        description: Computation engine used for cache separation.
        required: true
        type: string
      image:
        description: GHCR package name without registry or owner.
        required: true
        type: string
      dockerfile:
        description: Project-relative Dockerfile path.
        required: true
        type: string
      context:
        description: Project-relative Docker build context.
        required: false
        type: string
        default: .
      base_image:
        description: Base computation image passed as BASE_IMAGE.
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=project-compute-${{ inputs.engine }}
          cache-to: type=gha,mode=max,scope=project-compute-${{ inputs.engine }}
