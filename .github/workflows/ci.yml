name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test package
        run: python -m pip install -e ".[mcp]"

      - name: Compile Python
        run: python -m compileall -q src scripts test

      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s test -p 'test_*.py'

      - name: Check patch whitespace
        run: git diff --check

  distribution:
    name: Distribution structure and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build package
        run: python -m pip install "setuptools>=68" wheel -e .

      - name: Validate workflow policy
        run: make workflow-check

      - name: Validate distribution structure
        run: make distribution-check

      - name: Build and test wheel
        run: make wheel-check

  gem:
    name: Gem package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3.11"

      - name: Build and inspect gem
        run: make gem-check

  docker:
    name: Docker MCP and docs
    needs: [python, distribution, gem]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: unaltraweb-runtime:ci
          cache-from: type=gha,scope=ci-runtime
          cache-to: type=gha,mode=max,scope=ci-runtime

      - name: Test all Ruby files
        run: docker run --rm -v "$PWD:/work:ro" -w /work --entrypoint bash unaltraweb-runtime:ci -lc 'set -euo pipefail; shopt -s nullglob globstar; tests=(test/**/*_test.rb); ((${#tests[@]})); for test_file in "${tests[@]}"; do bundle exec ruby "$test_file"; done'

      - name: Build manual PDF image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: scripts/manual
          file: scripts/manual/Dockerfile
          load: true
          push: false
          tags: unaltraweb-manual-pdf:ci
          cache-from: type=gha,scope=manual-pdf
          cache-to: type=gha,mode=max,scope=manual-pdf

      - name: Test all manual PDF integrations
        run: docker run --rm -v "$PWD:/work:ro" -w /work --entrypoint python3 unaltraweb-manual-pdf:ci -m unittest discover -s test/manual_pdf -p 'test_*_integration.py'

      - name: Build MCP image from the tested runtime
        run: docker build --build-arg UNALTRAWEB_RUNTIME_IMAGE=unaltraweb-runtime:ci -t unaltraweb-mcp:ci -f Dockerfile.mcp .

      - name: Check reproducible packaged Jekyll build
        run: make reproducible-site-check DOCKER_IMAGE=unaltraweb-mcp:ci

      - name: Smoke test MCP
        run: make mcp-smoke-prebuilt MCP_IMAGE=unaltraweb-mcp:ci

      - name: Build docs
        run: make docs-build DOCKER_IMAGE=unaltraweb-runtime:ci
