name: Docker images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-core-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3.5"

      - name: Install test package
        run: python -m pip install "setuptools>=68" wheel -e ".[mcp]"

      - name: Validate distribution contract
        run: make distribution-check

      - name: Validate publish ref and versions
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/validate_distribution.py --validate-publish-ref --components runtime,mcp,manual_pdf

      - name: Run package and source tests
        run: |
          python -m compileall -q src scripts test
          PYTHONPATH=src python -m unittest discover -s test -p 'test_*.py'
          make wheel-check
          make gem-check
          git diff --check

  build-candidates:
    if: github.ref_type == 'branch'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      source_commit: ${{ steps.built.outputs.source_commit }}
      runtime_digest: ${{ steps.built.outputs.runtime_digest }}
      mcp_digest: ${{ steps.built.outputs.mcp_digest }}
      manual_pdf_digest: ${{ steps.built.outputs.manual_pdf_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Runtime metadata
        id: runtime-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/dosquartsdedocs/unaltraweb
          flavor: latest=false
          tags: type=raw,value=sha-${{ github.sha }},enable={{is_default_branch}}

      - name: MCP metadata
        id: mcp-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/dosquartsdedocs/unaltraweb-mcp
          flavor: latest=false
          tags: type=raw,value=sha-${{ github.sha }},enable={{is_default_branch}}

      - name: Manual PDF metadata
        id: manual-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/dosquartsdedocs/unaltraweb-manual-pdf
          flavor: latest=false
          tags: type=raw,value=sha-${{ github.sha }},enable={{is_default_branch}}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require unused candidate SHA tags
        env:
          MANUAL_PDF_CANDIDATE: ghcr.io/dosquartsdedocs/unaltraweb-manual-pdf:sha-${{ github.sha }}
          MCP_CANDIDATE: ghcr.io/dosquartsdedocs/unaltraweb-mcp:sha-${{ github.sha }}
          RUNTIME_CANDIDATE: ghcr.io/dosquartsdedocs/unaltraweb:sha-${{ github.sha }}
        run: |
          require_absent() {
            candidate="$1"
            if output="$(docker buildx imagetools inspect "$candidate" 2>&1)"; then
              printf 'candidate tag already exists and will not be overwritten: %s\n' "$candidate" >&2
              return 1
            fi
            error="$(printf '%s' "$output" | tr '[:upper:]' '[:lower:]')"
            case "$error" in
              *"manifest unknown"*|*"not found"*) ;;
              *)
                printf 'could not prove candidate tag is unused: %s\n%s\n' "$candidate" "$output" >&2
                return 1
                ;;
            esac
          }
          require_absent "$RUNTIME_CANDIDATE"
          require_absent "$MCP_CANDIDATE"
          require_absent "$MANUAL_PDF_CANDIDATE"

      - name: Build and publish runtime candidate
        id: runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ghcr.io/dosquartsdedocs/unaltraweb:sha-${{ github.sha }}
          labels: ${{ steps.runtime-meta.outputs.labels }}
          cache-from: type=gha,scope=core-runtime
          cache-to: type=gha,mode=max,scope=core-runtime
          sbom: true
          provenance: mode=max

      - name: Attest runtime candidate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/dosquartsdedocs/unaltraweb
          subject-digest: ${{ steps.runtime.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Build and publish MCP candidate from runtime digest
        id: mcp
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.mcp
          build-args: UNALTRAWEB_RUNTIME_IMAGE=ghcr.io/dosquartsdedocs/unaltraweb@${{ steps.runtime.outputs.digest }}
          push: true
          tags: ghcr.io/dosquartsdedocs/unaltraweb-mcp:sha-${{ github.sha }}
          labels: ${{ steps.mcp-meta.outputs.labels }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp
          sbom: true
          provenance: mode=max

      - name: Attest MCP candidate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/dosquartsdedocs/unaltraweb-mcp
          subject-digest: ${{ steps.mcp.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Build and publish manual PDF candidate
        id: manual
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: scripts/manual
          file: scripts/manual/Dockerfile
          push: true
          tags: ghcr.io/dosquartsdedocs/unaltraweb-manual-pdf:sha-${{ github.sha }}
          labels: ${{ steps.manual-meta.outputs.labels }}
          cache-from: type=gha,scope=manual-pdf
          cache-to: type=gha,mode=max,scope=manual-pdf
          sbom: true
          provenance: mode=max

      - name: Attest manual PDF candidate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/dosquartsdedocs/unaltraweb-manual-pdf
          subject-digest: ${{ steps.manual.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record built candidate digests
        id: built
        env:
          MANUAL_PDF_DIGEST: ${{ steps.manual.outputs.digest }}
          MCP_DIGEST: ${{ steps.mcp.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          printf 'source_commit=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          printf 'runtime_digest=%s\n' "$RUNTIME_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'mcp_digest=%s\n' "$MCP_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'manual_pdf_digest=%s\n' "$MANUAL_PDF_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'built source commit: %s\n' "$GITHUB_SHA"
          printf 'built runtime: ghcr.io/dosquartsdedocs/unaltraweb@%s\n' "$RUNTIME_DIGEST"
          printf 'built MCP: ghcr.io/dosquartsdedocs/unaltraweb-mcp@%s\n' "$MCP_DIGEST"
          printf 'built manual PDF: ghcr.io/dosquartsdedocs/unaltraweb-manual-pdf@%s\n' "$MANUAL_PDF_DIGEST"

  test-candidates:
    if: github.ref_type == 'branch'
    needs: build-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      runtime_digest: ${{ steps.tested.outputs.runtime_digest }}
      mcp_digest: ${{ steps.tested.outputs.mcp_digest }}
      manual_pdf_digest: ${{ steps.tested.outputs.manual_pdf_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Isolate Docker credentials
        run: printf 'DOCKER_CONFIG=%s\n' "$RUNNER_TEMP/unaltraweb-test-docker" >> "$GITHUB_ENV"

      - name: Log in to GHCR for read-only verification
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify signed provenance and exact candidate revisions
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_PDF_IMAGE: ghcr.io/dosquartsdedocs/unaltraweb-manual-pdf@${{ needs.build-candidates.outputs.manual_pdf_digest }}
          MCP_IMAGE: ghcr.io/dosquartsdedocs/unaltraweb-mcp@${{ needs.build-candidates.outputs.mcp_digest }}
          RUNTIME_IMAGE: ghcr.io/dosquartsdedocs/unaltraweb@${{ needs.build-candidates.outputs.runtime_digest }}
        run: |
          verify_candidate() {
            image="$1"
            gh attestation verify "oci://${image}" \
              --bundle-from-oci \
              --repo dosquartsdedocs/unaltraweb \
              --signer-workflow dosquartsdedocs/unaltraweb/.github/workflows/docker-image.yml \
              --source-digest "$GITHUB_SHA"
            docker pull "$image"
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
            if [ "$revision" != "$GITHUB_SHA" ]; then
              printf 'candidate revision mismatch: %s has %s, expected %s\n' "$image" "$revision" "$GITHUB_SHA" >&2
              return 1
            fi
          }
          verify_candidate "$RUNTIME_IMAGE"
          verify_candidate "$MCP_IMAGE"
          verify_candidate "$MANUAL_PDF_IMAGE"

      - name: Remove GHCR credentials before candidate execution
        run: |
          docker logout ghcr.io
          rm -rf -- "$DOCKER_CONFIG"
          mkdir -m 0700 -- "$DOCKER_CONFIG"
          printf '{"auths":{}}\n' > "$DOCKER_CONFIG/config.json"

      - name: Test all Ruby files in exact runtime
        env:
          RUNTIME_IMAGE: ghcr.io/dosquartsdedocs/unaltraweb@${{ needs.build-candidates.outputs.runtime_digest }}
        run: docker run --rm -v "$PWD:/work:ro" -w /work --entrypoint bash "$RUNTIME_IMAGE" -lc 'set -euo pipefail; shopt -s nullglob globstar; tests=(test/**/*_test.rb); ((${#tests[@]})); for test_file in "${tests[@]}"; do bundle exec ruby "$test_file"; done'

      - name: Test all manual PDF integrations in exact image
        env:
          MANUAL_PDF_IMAGE: ghcr.io/dosquartsdedocs/unaltraweb-manual-pdf@${{ needs.build-candidates.outputs.manual_pdf_digest }}
        run: docker run --rm -v "$PWD:/work:ro" -w /work --entrypoint python3 "$MANUAL_PDF_IMAGE" -m unittest discover -s test/manual_pdf -p 'test_*_integration.py'

      - name: Check reproducible packaged Jekyll build with exact MCP
        env:
          MCP_IMAGE: ghcr.io/dosquartsdedocs/unaltraweb-mcp@${{ needs.build-candidates.outputs.mcp_digest }}
        run: make reproducible-site-check DOCKER_IMAGE="$MCP_IMAGE"

      - name: Smoke test exact MCP
        env:
          MCP_IMAGE: ghcr.io/dosquartsdedocs/unaltraweb-mcp@${{ needs.build-candidates.outputs.mcp_digest }}
        run: make mcp-smoke-prebuilt MCP_IMAGE="$MCP_IMAGE"

      - name: Build docs with exact runtime
        env:
          RUNTIME_IMAGE: ghcr.io/dosquartsdedocs/unaltraweb@${{ needs.build-candidates.outputs.runtime_digest }}
        run: make docs-build DOCKER_IMAGE="$RUNTIME_IMAGE"

      - name: Record tested candidate digests
        id: tested
        env:
          MANUAL_PDF_DIGEST: ${{ needs.build-candidates.outputs.manual_pdf_digest }}
          MCP_DIGEST: ${{ needs.build-candidates.outputs.mcp_digest }}
          RUNTIME_DIGEST: ${{ needs.build-candidates.outputs.runtime_digest }}
        run: |
          printf 'runtime_digest=%s\n' "$RUNTIME_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'mcp_digest=%s\n' "$MCP_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'manual_pdf_digest=%s\n' "$MANUAL_PDF_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'tested source commit: %s\n' "$GITHUB_SHA"
          printf 'tested runtime: ghcr.io/dosquartsdedocs/unaltraweb@%s\n' "$RUNTIME_DIGEST"
          printf 'tested MCP: ghcr.io/dosquartsdedocs/unaltraweb-mcp@%s\n' "$MCP_DIGEST"
          printf 'tested manual PDF: ghcr.io/dosquartsdedocs/unaltraweb-manual-pdf@%s\n' "$MANUAL_PDF_DIGEST"
          {
            printf '### Tested core image candidates\n\n'
            printf '| Component | Source commit | Exact reference |\n'
            printf '| --- | --- | --- |\n'
            printf '| Runtime | `%s` | `ghcr.io/dosquartsdedocs/unaltraweb@%s` |\n' "$GITHUB_SHA" "$RUNTIME_DIGEST"
            printf '| MCP | `%s` | `ghcr.io/dosquartsdedocs/unaltraweb-mcp@%s` |\n' "$GITHUB_SHA" "$MCP_DIGEST"
            printf '| Manual PDF | `%s` | `ghcr.io/dosquartsdedocs/unaltraweb-manual-pdf@%s` |\n' "$GITHUB_SHA" "$MANUAL_PDF_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-candidates:
    if: github.ref_type == 'branch'
    needs: test-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reverify tested candidate provenance and revisions
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_PDF_SOURCE: ghcr.io/dosquartsdedocs/unaltraweb-manual-pdf@${{ needs.test-candidates.outputs.manual_pdf_digest }}
          MCP_SOURCE: ghcr.io/dosquartsdedocs/unaltraweb-mcp@${{ needs.test-candidates.outputs.mcp_digest }}
          RUNTIME_SOURCE: ghcr.io/dosquartsdedocs/unaltraweb@${{ needs.test-candidates.outputs.runtime_digest }}
        run: |
          verify_candidate() {
            repository="$1"
            source="$2"
            candidate="${repository}:sha-${GITHUB_SHA}"
            expected="${source##*@}"
            actual="$(docker buildx imagetools inspect "$candidate" --format '{{.Manifest.Digest}}')"
            if [ "$actual" != "$expected" ]; then
              printf 'candidate digest mismatch: %s resolves to %s, expected %s\n' "$candidate" "$actual" "$expected" >&2
              return 1
            fi
            gh attestation verify "oci://${source}" \
              --bundle-from-oci \
              --repo dosquartsdedocs/unaltraweb \
              --signer-workflow dosquartsdedocs/unaltraweb/.github/workflows/docker-image.yml \
              --source-digest "$GITHUB_SHA"
            docker pull "$source"
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$source")"
            if [ "$revision" != "$GITHUB_SHA" ]; then
              printf 'candidate revision mismatch: %s has %s, expected %s\n' "$source" "$revision" "$GITHUB_SHA" >&2
              return 1
            fi
          }
          verify_candidate ghcr.io/dosquartsdedocs/unaltraweb "$RUNTIME_SOURCE"
          verify_candidate ghcr.io/dosquartsdedocs/unaltraweb-mcp "$MCP_SOURCE"
          verify_candidate ghcr.io/dosquartsdedocs/unaltraweb-manual-pdf "$MANUAL_PDF_SOURCE"

      - name: Promote tested candidates to default-branch aliases
        env:
          MANUAL_PDF_SOURCE: ghcr.io/dosquartsdedocs/unaltraweb-manual-pdf@${{ needs.test-candidates.outputs.manual_pdf_digest }}
          MCP_SOURCE: ghcr.io/dosquartsdedocs/unaltraweb-mcp@${{ needs.test-candidates.outputs.mcp_digest }}
          RUNTIME_SOURCE: ghcr.io/dosquartsdedocs/unaltraweb@${{ needs.test-candidates.outputs.runtime_digest }}
        run: |
          promote_aliases() {
            repository="$1"
            source="$2"
            expected="${source##*@}"
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "${repository}:sha-${GITHUB_SHA}" \
              --tag "${repository}:main" \
              --tag "${repository}:latest" \
              "$source"
            for alias in "sha-${GITHUB_SHA}" main latest; do
              actual="$(docker buildx imagetools inspect "${repository}:${alias}" --format '{{.Manifest.Digest}}')"
              if [ "$actual" != "$expected" ]; then
                printf 'promoted alias mismatch: %s:%s resolves to %s, expected %s\n' "$repository" "$alias" "$actual" "$expected" >&2
                return 1
              fi
            done
          }
          promote_aliases ghcr.io/dosquartsdedocs/unaltraweb "$RUNTIME_SOURCE"
          promote_aliases ghcr.io/dosquartsdedocs/unaltraweb-mcp "$MCP_SOURCE"
          promote_aliases ghcr.io/dosquartsdedocs/unaltraweb-manual-pdf "$MANUAL_PDF_SOURCE"

  promote-release:
    if: github.ref_type == 'tag'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Read release version and candidate receipt
        id: release
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          contract = json.load(open("src/unaltraweb_mcp/component-contract.json"))
          receipt = json.load(open("release-candidates.json"))
          print(f"version={contract['release']['version']}")
          print(f"source_commit={receipt['source_commit']}")
          for component_id in ["runtime", "mcp", "manual_pdf"]:
              component = contract["components"][component_id]
              candidate = receipt["components"].get(component_id)
              source = candidate["reference"] if candidate else ""
              print(f"{component_id}={source}")
              print(f"{component_id}_repository={component['image_repository']}")
              candidate_tag = f"{component['image_repository']}:sha-{receipt['source_commit']}" if candidate else ""
              print(f"{component_id}_candidate={candidate_tag}")
          PY

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify recorded candidate provenance and source binding
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_PDF_CANDIDATE: ${{ steps.release.outputs.manual_pdf_candidate }}
          MANUAL_PDF_SOURCE: ${{ steps.release.outputs.manual_pdf }}
          MCP_CANDIDATE: ${{ steps.release.outputs.mcp_candidate }}
          MCP_SOURCE: ${{ steps.release.outputs.mcp }}
          RUNTIME_CANDIDATE: ${{ steps.release.outputs.runtime_candidate }}
          RUNTIME_SOURCE: ${{ steps.release.outputs.runtime }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          verify_candidate() {
            candidate="$1"
            source="$2"
            if [ -z "$candidate" ]; then return; fi
            actual="$(docker buildx imagetools inspect "$candidate" --format '{{.Manifest.Digest}}')"
            expected="${source##*@}"
            if [ "$actual" != "$expected" ]; then
              printf 'candidate digest mismatch: %s resolves to %s, expected %s\n' "$candidate" "$actual" "$expected" >&2
              return 1
            fi
            gh attestation verify "oci://${source}" \
              --bundle-from-oci \
              --repo dosquartsdedocs/unaltraweb \
              --signer-workflow dosquartsdedocs/unaltraweb/.github/workflows/docker-image.yml \
              --source-digest "$SOURCE_COMMIT"
            docker pull "$source"
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$source")"
            if [ "$revision" != "$SOURCE_COMMIT" ]; then
              printf 'candidate revision mismatch: %s has %s, expected source_commit %s\n' "$source" "$revision" "$SOURCE_COMMIT" >&2
              return 1
            fi
          }
          verify_candidate "$RUNTIME_CANDIDATE" "$RUNTIME_SOURCE"
          verify_candidate "$MCP_CANDIDATE" "$MCP_SOURCE"
          verify_candidate "$MANUAL_PDF_CANDIDATE" "$MANUAL_PDF_SOURCE"

      - name: Promote reviewed runtime candidate
        if: steps.release.outputs.runtime != ''
        env:
          REPOSITORY: ${{ steps.release.outputs.runtime_repository }}
          SOURCE: ${{ steps.release.outputs.runtime }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${REPOSITORY}:${VERSION}" \
            --tag "${REPOSITORY}:v${VERSION}" \
            "$SOURCE"
          expected="${SOURCE##*@}"
          for alias in "$VERSION" "v${VERSION}"; do
            actual="$(docker buildx imagetools inspect "${REPOSITORY}:${alias}" --format '{{.Manifest.Digest}}')"
            if [ "$actual" != "$expected" ]; then
              printf 'release alias mismatch: %s:%s resolves to %s, expected %s\n' "$REPOSITORY" "$alias" "$actual" "$expected" >&2
              exit 1
            fi
          done

      - name: Promote reviewed MCP candidate
        if: steps.release.outputs.mcp != ''
        env:
          REPOSITORY: ${{ steps.release.outputs.mcp_repository }}
          SOURCE: ${{ steps.release.outputs.mcp }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${REPOSITORY}:${VERSION}" \
            --tag "${REPOSITORY}:v${VERSION}" \
            "$SOURCE"
          expected="${SOURCE##*@}"
          for alias in "$VERSION" "v${VERSION}"; do
            actual="$(docker buildx imagetools inspect "${REPOSITORY}:${alias}" --format '{{.Manifest.Digest}}')"
            if [ "$actual" != "$expected" ]; then
              printf 'release alias mismatch: %s:%s resolves to %s, expected %s\n' "$REPOSITORY" "$alias" "$actual" "$expected" >&2
              exit 1
            fi
          done

      - name: Promote reviewed manual PDF candidate
        if: steps.release.outputs.manual_pdf != ''
        env:
          REPOSITORY: ${{ steps.release.outputs.manual_pdf_repository }}
          SOURCE: ${{ steps.release.outputs.manual_pdf }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${REPOSITORY}:${VERSION}" \
            --tag "${REPOSITORY}:v${VERSION}" \
            "$SOURCE"
          expected="${SOURCE##*@}"
          for alias in "$VERSION" "v${VERSION}"; do
            actual="$(docker buildx imagetools inspect "${REPOSITORY}:${alias}" --format '{{.Manifest.Digest}}')"
            if [ "$actual" != "$expected" ]; then
              printf 'release alias mismatch: %s:%s resolves to %s, expected %s\n' "$REPOSITORY" "$alias" "$actual" "$expected" >&2
              exit 1
            fi
          done
