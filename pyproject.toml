[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unaltraweb-mcp"
version = "0.1.0"
description = "MCP control plane for unaltraweb website workspaces"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "dosquartsdedocs" }
]
keywords = ["jekyll", "mcp", "websites", "bibliometrics"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]

[project.scripts]
unaltraweb-mcp = "unaltraweb_mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
