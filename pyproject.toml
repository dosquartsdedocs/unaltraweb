[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unaltraweb-mcp"
dynamic = ["version"]
description = "MCP control plane for unaltraweb website workspaces"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "dosquartsdedocs" }
]
keywords = ["jekyll", "mcp", "websites", "bibliometrics"]
dependencies = [
  "bibtexparser>=1.4,<2",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "Pillow>=10.4,<13",
  "CairoSVG>=2.7,<3",
  "pypdf>=6,<7",
  "markdown-it-py>=3,<5",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0,<2"]
artifact-storage = ["boto3==1.40.75", "botocore==1.40.75", "s3transfer==0.14.0", "jmespath==1.0.1", "python-dateutil==2.9.0.post0", "six==1.17.0", "urllib3==2.5.0"]

[project.scripts]
unaltraweb-mcp = "unaltraweb_mcp.cli:main"
unaltraweb-mcp-docker = "unaltraweb_mcp.docker_launcher:main"
unaltraweb-source-checks = "unaltraweb_mcp.source_checks:main"
unaltraweb-candidate-storage = "unaltraweb_mcp.candidate_storage:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "unaltraweb_mcp.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/unaltraweb-launcher" = ["packaging/launcher/Makefile", "mcp-factory.yml"]
"share/unaltraweb-launcher/scripts" = [
  "scripts/unaltraweb-mcp-bootstrap.sh",
  "scripts/unaltraweb-mcp-project-id.sh",
  "scripts/unaltraweb-mcp-cleanup.sh",
  "scripts/unaltraweb-docker-mount.sh",
]

[tool.setuptools.package-data]
unaltraweb_mcp = [
  "component-contract.json",
  "component-contract.schema.json",
  "consumer-core.json",
  "artifact-handoff-v1.schema.json",
  "practice-edition-v1.schema.json",
  "manual-context-v1.schema.json",
  "practice-verifier-runtime.json",
  "source-check-policy-v1.schema.json",
  "artifact-storage-v1.schema.json",
  "scaffolds/common/*",
  "scaffolds/common/.gitignore.tmpl",
  "scaffolds/common/.unaltraweb/*.sh",
  "scaffolds/common/.unaltraweb/*.json",
  "scaffolds/common/.github/*.md",
  "scaffolds/common/.github/*.yml",
  "scaffolds/common/.github/*.tmpl",
  "scaffolds/common/.github/workflows/*.tmpl",
  "scaffolds/profiles/*/*.tmpl",
  "scaffolds/profiles/*/**/*",
  "scaffolds/profiles/*/**/.gitkeep",
]
